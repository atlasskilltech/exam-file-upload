<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS Exam — Exam Submissions</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .exam-banner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; }
    .exam-banner h2 { font-family: var(--font-heading); font-weight: 800; font-size: 22px; margin-bottom: 8px; }
    .exam-banner .meta { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
    .exam-banner .meta span { margin-right: 16px; }
    .slot-tag { display: inline-block; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; font-size: 11px; color: var(--cyan); margin: 2px 4px 2px 0; }
    .slot-tag .room { color: var(--accent); }
    .status-active { color: var(--green); }
    .status-closed { color: var(--text-muted); }
    .qp-banner { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .qp-banner a { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; font-size: 11px; color: var(--cyan); text-decoration: none; }
    .qp-banner a:hover { border-color: var(--accent); color: var(--accent); }
    .sub-stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .sub-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 24px; text-align: center; flex: 1; min-width: 120px; }
    .sub-stat .val { font-family: var(--font-heading); font-weight: 800; font-size: 28px; }
    .sub-stat .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .not-submitted-list { margin-top: 8px; }
    .not-submitted-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .not-submitted-item .app-id { color: var(--red); font-size: 11px; }
    @media (max-width: 768px) {
      .sub-stats { gap: 8px; }
      .sub-stat { padding: 12px 16px; min-width: 80px; }
      .sub-stat .val { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <h1 id="pageTitle">Submissions</h1>
          <p><a href="/exams.html" style="color:var(--accent);text-decoration:none">Back to Exams</a></p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="downloadZip()">Download ZIP</button>
          <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
        </div>
      </div>

      <div class="exam-banner" id="examBanner">Loading exam info...</div>

      <div class="sub-stats" id="subStats"></div>

      <div class="card" style="position:relative">
        <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Student</th>
                <th>File Name</th>
                <th>Size</th>
                <th>Submitted At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="subsTable">
              <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card" id="notSubmittedCard" style="display:none">
        <div class="card-header" style="color:var(--red)">Not Submitted Students</div>
        <div class="not-submitted-list" id="notSubmittedList"></div>
      </div>
    </main>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    function fmtDate(d) { if (!d) return ''; return new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }); }
    function fmtTime(t) { if (!t) return ''; return String(t).slice(0, 5); }

    const params = new URLSearchParams(window.location.search);
    const examId = params.get('id');
    if (!examId) { window.location.href = '/exams.html'; }

    (async () => {
      const user = await checkAuth();
      if (!user) return;
      if (user.role !== 'admin') { window.location.href = '/dashboard.html'; return; }

      document.getElementById('app').insertAdjacentHTML('afterbegin', getSidebarHTML());
      initSidebar(user);
      loadSubmissions();
    })();

    async function loadSubmissions() {
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('active');

      try {
        const res = await apiFetch(`/exams/${examId}/submissions`);
        const { exam, slots, submissions, assigned_count, not_submitted } = res.data;

        document.getElementById('pageTitle').textContent = `Submissions — ${exam.title}`;

        // Stat boxes
        const submittedCount = submissions.length;
        const notSubmittedCount = not_submitted ? not_submitted.length : 0;
        const totalAssigned = assigned_count || 0;

        document.getElementById('subStats').innerHTML = `
          <div class="sub-stat"><div class="val" style="color:var(--cyan)">${totalAssigned}</div><div class="lbl">Assigned</div></div>
          <div class="sub-stat"><div class="val" style="color:var(--green)">${submittedCount}</div><div class="lbl">Submitted</div></div>
          <div class="sub-stat"><div class="val" style="color:var(--red)">${notSubmittedCount}</div><div class="lbl">Not Submitted</div></div>
          <div class="sub-stat"><div class="val" style="color:var(--accent)">${submittedCount}</div><div class="lbl">Total Files</div></div>
        `;

        const slotTags = (slots || []).map(s =>
          `<span class="slot-tag"><span class="room">${esc(s.room)}</span> ${fmtDate(s.slot_date)} ${fmtTime(s.start_time)}–${fmtTime(s.end_time)}</span>`
        ).join('') || '<span style="color:var(--text-muted)">No slots</span>';

        // Load question papers for this exam
        let papersHTML = '';
        try {
          const papersRes = await apiFetch(`/exams/${examId}/question-papers`);
          if (papersRes.data.length > 0) {
            papersHTML = `<div class="qp-banner" style="margin-top:8px">
              <span style="font-size:11px;color:var(--text-muted);align-self:center">Question Papers:</span>
              ${papersRes.data.map(p => `<a href="/exams/question-papers/download/${p.id}">${esc(p.original_name)} (${formatSize(p.size_bytes)})</a>`).join('')}
            </div>`;
          }
        } catch {}

        // Exam description (if exists)
        const descHTML = exam.description ? `<p style="color:var(--text-muted);font-size:13px;margin-top:4px">${esc(exam.description)}</p>` : '';

        document.getElementById('examBanner').innerHTML = `
          <div>
            <h2>${esc(exam.title)}</h2>
            ${descHTML}
            <div class="meta" style="margin-top:8px">
              <span>Subject: <strong>${esc(exam.subject)}</strong></span>
              <span class="status-${exam.status}">${exam.status.toUpperCase()}</span>
            </div>
            <div style="margin-top:6px">${slotTags}</div>
            ${papersHTML}
          </div>
        `;

        const tbody = document.getElementById('subsTable');
        if (submissions.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No submissions yet</td></tr>';
        } else {
          tbody.innerHTML = submissions.map((s, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${esc(s.student_name)} <span style="color:var(--accent);font-size:11px">${esc(s.student_app_id || '')}</span></td>
              <td>${esc(s.original_name)}</td>
              <td>${formatSize(s.size_bytes)}</td>
              <td>${formatDate(s.submitted_at)}</td>
              <td>
                <a href="/exams/submissions/download/${s.id}" class="btn btn-secondary btn-sm">Download</a>
              </td>
            </tr>
          `).join('');
        }

        // Not submitted students card
        const notSubmittedCard = document.getElementById('notSubmittedCard');
        const notSubmittedList = document.getElementById('notSubmittedList');
        if (not_submitted && not_submitted.length > 0) {
          notSubmittedCard.style.display = 'block';
          notSubmittedList.innerHTML = not_submitted.map(s => `
            <div class="not-submitted-item">
              <strong>${esc(s.username)}</strong>
              <span class="app-id">${esc(s.app_id || '')}</span>
            </div>
          `).join('');
        } else {
          notSubmittedCard.style.display = 'none';
        }
      } catch (err) {
        showToast('Failed to load submissions', 'error');
      }

      overlay.classList.remove('active');
    }

    function exportCSV() {
      window.location.href = `/exams/${examId}/submissions/export`;
    }

    function downloadZip() {
      showToast('Preparing zip download...');
      window.location.href = `/exams/${examId}/submissions/download-zip`;
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }
  </script>
</body>
</html>
