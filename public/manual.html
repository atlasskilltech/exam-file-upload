<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS Exam — User Manual</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .manual-content { max-width: 820px; }
    .manual-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .manual-section h2 { font-family: var(--font-heading); font-weight: 700; font-size: 18px; color: var(--accent); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .manual-section h3 { font-family: var(--font-heading); font-weight: 600; font-size: 14px; color: var(--cyan); margin: 16px 0 8px; }
    .manual-section p { font-size: 13px; color: var(--text-muted); line-height: 1.8; margin-bottom: 8px; }
    .manual-section ul, .manual-section ol { font-size: 13px; color: var(--text-muted); line-height: 1.8; padding-left: 20px; margin-bottom: 12px; }
    .manual-section li { margin-bottom: 4px; }
    .manual-section strong { color: var(--text); }
    .manual-section code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-size: 12px; color: var(--cyan); }
    .step-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: var(--accent); color: #000; border-radius: 50%; font-size: 11px; font-weight: 700; margin-right: 6px; }
    .role-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin-left: 4px; }
    .role-tag.admin { background: var(--cyan-dim); color: var(--cyan); }
    .role-tag.student { background: rgba(52,152,219,0.15); color: #3498db; }
    .role-tag.all { background: var(--accent-dim); color: var(--accent); }
    .toc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; }
    .toc h2 { font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--accent); margin-bottom: 12px; }
    .toc a { display: block; padding: 4px 0; color: var(--text-muted); text-decoration: none; font-size: 13px; }
    .toc a:hover { color: var(--accent); }
    .tip-box { background: var(--accent-dim); border: 1px solid rgba(232,255,71,0.3); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; font-size: 12px; color: var(--accent); }
    .warn-box { background: var(--red-dim); border: 1px solid rgba(255,71,87,0.3); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; font-size: 12px; color: var(--red); }
  </style>
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header">
        <h1>User Manual</h1>
        <p>Complete guide for using ATLAS Exam — Exam Management System</p>
      </div>

      <div class="manual-content" id="manualContent">
        <!-- Content will be rendered based on role -->
      </div>
    </main>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    (async () => {
      const user = await checkAuth();
      if (!user) return;

      document.getElementById('app').insertAdjacentHTML('afterbegin', getSidebarHTML());
      initSidebar(user);

      renderManual(user.role);
    })();

    function renderManual(role) {
      const container = document.getElementById('manualContent');

      // Table of contents
      let tocItems = [];
      if (role === 'admin') {
        tocItems = [
          { id: 'overview', label: 'System Overview' },
          { id: 'login', label: 'Logging In' },
          { id: 'exam-create', label: 'Creating Exams' },
          { id: 'exam-slots', label: 'Managing Time Slots' },
          { id: 'question-papers', label: 'Uploading Question Papers' },
          { id: 'assign-students', label: 'Assigning Students to Exams' },
          { id: 'exam-status', label: 'Opening & Closing Exams' },
          { id: 'submissions', label: 'Viewing Student Submissions' },
          { id: 'user-mgmt', label: 'User Management' },
          { id: 'bulk-upload', label: 'Bulk Upload Students (CSV)' },
          { id: 'reports', label: 'Reports & Analytics' },
          { id: 'tips', label: 'Tips & Best Practices' },
        ];
      } else {
        tocItems = [
          { id: 'overview', label: 'System Overview' },
          { id: 'login', label: 'Logging In' },
          { id: 'view-exams', label: 'Viewing Today\'s Exams' },
          { id: 'download-qp', label: 'Downloading Question Papers' },
          { id: 'submit-answer', label: 'Submitting Your Answer' },
          { id: 'reupload', label: 'Re-uploading an Answer' },
          { id: 'history', label: 'Submission History' },
          { id: 'tips', label: 'Tips & Best Practices' },
        ];
      }

      let html = `
        <div class="toc">
          <h2>Table of Contents</h2>
          ${tocItems.map((t, i) => `<a href="#${t.id}"><span class="step-num">${i + 1}</span> ${t.label}</a>`).join('')}
        </div>
      `;

      if (role === 'admin') {
        html += getAdminManual();
      } else {
        html += getStudentManual();
      }

      container.innerHTML = html;
    }

    function getAdminManual() {
      return `

        <div class="manual-section" id="overview">
          <h2>System Overview <span class="role-tag admin">Admin</span></h2>
          <p>ATLAS Exam is an offline exam management system that allows you to:</p>
          <ul>
            <li><strong>Create and manage exams</strong> with multiple time slots and rooms</li>
            <li><strong>Upload question papers</strong> for students to download during exams</li>
            <li><strong>Assign specific students</strong> to each exam</li>
            <li><strong>Collect student submissions</strong> (answer files) organized by exam</li>
            <li><strong>Track activity</strong> with reports and analytics</li>
            <li><strong>Manage users</strong> — add admins, users, and students</li>
          </ul>
          <p>The system works entirely offline on your local network. Students log in with their App ID and can only see exams they are assigned to.</p>
        </div>

        <div class="manual-section" id="login">
          <h2>Logging In</h2>
          <p>Open the application in your browser. On the login page:</p>
          <ol>
            <li>Select the <strong>Admin / User</strong> tab</li>
            <li>Enter your <strong>username</strong> and <strong>password</strong></li>
            <li>Click <strong>Login</strong></li>
          </ol>
          <div class="tip-box">Default admin credentials: username <code>admin</code>, password <code>admin123</code>. Change this after first login.</div>
        </div>

        <div class="manual-section" id="exam-create">
          <h2>Creating Exams</h2>
          <p>Navigate to <strong>Exam Manager</strong> from the sidebar.</p>
          <ol>
            <li>Click the <strong>+ Create Exam</strong> button</li>
            <li>Enter the <strong>Exam Title</strong> (e.g., "Mathematics Final")</li>
            <li>Enter the <strong>Subject</strong> (e.g., "Grade 12 Maths")</li>
            <li>Add at least one <strong>Time Slot</strong>:
              <ul>
                <li><strong>Date</strong> — the exam date</li>
                <li><strong>Start Time</strong> — when the exam begins</li>
                <li><strong>End Time</strong> — when submissions close</li>
                <li><strong>Room</strong> — the room/hall name</li>
              </ul>
            </li>
            <li>Click <strong>+ Add Slot</strong> to add more slots if the exam runs in multiple sessions</li>
            <li>Click <strong>Create Exam</strong></li>
          </ol>
          <div class="tip-box">You can edit the exam title, subject, and slots later using the <strong>Edit</strong> button.</div>
        </div>

        <div class="manual-section" id="exam-slots">
          <h2>Managing Time Slots</h2>
          <p>Each exam can have multiple time slots (different dates, times, or rooms).</p>
          <ol>
            <li>In the exam table, click the <strong>Slots</strong> button on an exam</li>
            <li>View existing slots and remove any if needed</li>
            <li>Add a new slot by filling in date, start time, end time, and room, then click <strong>Add</strong></li>
          </ol>
          <p>Students can only submit answers while at least one slot is still open (current time is before the slot's end time).</p>
        </div>

        <div class="manual-section" id="question-papers">
          <h2>Uploading Question Papers</h2>
          <p>You can upload question paper files for each exam. Assigned students will be able to download them.</p>
          <ol>
            <li>In the exam table, click the <strong>Papers</strong> button on an exam</li>
            <li>You will see any previously uploaded papers listed with download and delete options</li>
            <li>To upload a new paper, click <strong>Choose File</strong> and select the question paper (PDF, DOC, JPG, PNG, ZIP, etc.)</li>
            <li>Click <strong>Upload</strong></li>
            <li>The paper will appear in the list immediately</li>
          </ol>
          <p>You can upload <strong>multiple question papers</strong> per exam (e.g., Paper 1, Paper 2, answer sheet template).</p>
          <div class="tip-box">Maximum file size is <strong>100 MB</strong> per file. Supported formats: PDF, DOC, DOCX, JPG, PNG, ZIP, XLS, XLSX, PPT, PPTX.</div>
        </div>

        <div class="manual-section" id="assign-students">
          <h2>Assigning Students to Exams</h2>
          <p>Students will only see exams they are specifically assigned to. This prevents students from accessing exams they are not part of.</p>
          <ol>
            <li>In the exam table, click the <strong>Students</strong> button on an exam</li>
            <li>The top section shows currently assigned students with the option to <strong>Remove</strong> each</li>
            <li>The bottom section shows a <strong>searchable checkbox list</strong> of all available students</li>
            <li>Use the search box to filter students by name or App ID</li>
            <li>Check the students you want to assign</li>
            <li>Click <strong>Assign Selected</strong></li>
          </ol>
          <div class="warn-box">If no students are assigned to an exam, <strong>no student will see it</strong>. Always assign students before the exam date.</div>
        </div>

        <div class="manual-section" id="exam-status">
          <h2>Opening & Closing Exams</h2>
          <p>Each exam has a status: <strong>Active</strong> (green) or <strong>Closed</strong> (grey).</p>
          <ul>
            <li><strong>Active</strong> — students can view the exam and submit answers (if within time)</li>
            <li><strong>Closed</strong> — no new submissions accepted, exam hidden from students</li>
          </ul>
          <p>Click the <strong>Close</strong> button to close an active exam, or <strong>Open</strong> to reactivate a closed one.</p>
        </div>

        <div class="manual-section" id="submissions">
          <h2>Viewing Student Submissions</h2>
          <ol>
            <li>In the exam table, click the <strong>View</strong> button on an exam</li>
            <li>The submissions page shows:
              <ul>
                <li>Exam details, slots, and question papers at the top</li>
                <li>A table of all student submissions with name, file, size, and timestamp</li>
              </ul>
            </li>
            <li>Click <strong>Download</strong> to download any student's submission</li>
            <li>Click <strong>Export CSV</strong> to export the submission list as a spreadsheet</li>
          </ol>
          <p>Submitted files are organized on disk under <code>uploads/exam_submissions/</code> in folders named by exam.</p>
        </div>

        <div class="manual-section" id="user-mgmt">
          <h2>User Management</h2>
          <p>Navigate to <strong>Admin Panel</strong> from the sidebar.</p>
          <h3>Adding a Single User</h3>
          <ol>
            <li>Click <strong>+ Add User</strong></li>
            <li>Enter the <strong>username</strong></li>
            <li>Select the <strong>role</strong>:
              <ul>
                <li><strong>Admin</strong> — full system access (requires password)</li>
                <li><strong>User</strong> — file management access (requires password)</li>
                <li><strong>Student</strong> — exam access only (requires App ID, no password)</li>
              </ul>
            </li>
            <li>For Admin/User: enter a <strong>password</strong></li>
            <li>For Student: enter an <strong>App ID</strong> (unique identifier like roll number)</li>
            <li>Click <strong>Add User</strong></li>
          </ol>
        </div>

        <div class="manual-section" id="bulk-upload">
          <h2>Bulk Upload Students (CSV)</h2>
          <p>To add many students at once:</p>
          <ol>
            <li>In the Admin Panel, click <strong>Bulk Upload CSV</strong></li>
            <li>Prepare a CSV file with the format: <code>name,app_id</code> (one student per line)</li>
            <li>Example CSV content:<br>
              <code>John Doe,STU001</code><br>
              <code>Jane Smith,STU002</code><br>
              <code>Ravi Kumar,STU003</code>
            </li>
            <li>Select the CSV file and click <strong>Upload</strong></li>
            <li>Duplicate App IDs will be skipped automatically</li>
          </ol>
        </div>

        <div class="manual-section" id="reports">
          <h2>Reports & Analytics</h2>
          <p>Navigate to <strong>Reports</strong> from the sidebar to view:</p>
          <ul>
            <li><strong>Total files</strong> uploaded and monthly count</li>
            <li><strong>Storage usage</strong> across all files</li>
            <li><strong>Files by type</strong> — images, videos, PDFs, documents</li>
            <li><strong>Top uploaders</strong> — most active users</li>
            <li><strong>Recent activity</strong> — last 20 actions in the system</li>
          </ul>
        </div>

        <div class="manual-section" id="tips">
          <h2>Tips & Best Practices</h2>
          <ul>
            <li>Always <strong>assign students</strong> to exams before the exam date</li>
            <li>Upload <strong>question papers</strong> before the exam starts so students can download them</li>
            <li>Set accurate <strong>time slots</strong> — submissions are blocked after the last slot ends</li>
            <li><strong>Close exams</strong> after completion to prevent late submissions</li>
            <li>Use <strong>Export CSV</strong> to keep a record of submissions</li>
            <li>Use <strong>Bulk Upload CSV</strong> for large batches of students</li>
            <li>Submitted files are stored in <code>uploads/exam_submissions/</code> — back up this folder regularly</li>
            <li>Question papers are stored in <code>uploads/exam_papers/</code> — back up this folder too</li>
          </ul>
        </div>
      `;
    }

    function getStudentManual() {
      return `

        <div class="manual-section" id="overview">
          <h2>System Overview <span class="role-tag student">Student</span></h2>
          <p>ATLAS Exam allows you to:</p>
          <ul>
            <li><strong>View exams</strong> assigned to you for today</li>
            <li><strong>Download question papers</strong> uploaded by your admin/teacher</li>
            <li><strong>Upload your answer file</strong> (PDF, DOC, JPG, PNG, ZIP, etc.)</li>
            <li><strong>Re-upload</strong> your answer if the exam is still open</li>
            <li><strong>View your submission history</strong> across all exams</li>
          </ul>
          <p>You can only see exams that you have been assigned to by the admin.</p>
        </div>

        <div class="manual-section" id="login">
          <h2>Logging In</h2>
          <p>Open the application in your browser. On the login page:</p>
          <ol>
            <li>Select the <strong>Student</strong> tab</li>
            <li>Enter your <strong>App ID</strong> (provided by your admin/teacher, e.g., STU001)</li>
            <li>Click <strong>Login</strong></li>
          </ol>
          <div class="tip-box">No password is needed. Your App ID is your unique identifier (like a roll number).</div>
        </div>

        <div class="manual-section" id="view-exams">
          <h2>Viewing Today's Exams</h2>
          <p>After logging in, you will land on the <strong>Today's Exams</strong> page. This shows:</p>
          <ul>
            <li><strong>Exam cards</strong> — one card per exam assigned to you today</li>
            <li><strong>Time slots</strong> — showing room, date, start/end times, and a live countdown</li>
            <li><strong>Status</strong> — Not Submitted (red), Submitted (green), or Closed (grey)</li>
            <li><strong>Stats</strong> at the top — total exams today, submitted count, pending count</li>
          </ul>
          <p>Only exams scheduled for <strong>today</strong> and marked as <strong>active</strong> will appear here.</p>
        </div>

        <div class="manual-section" id="download-qp">
          <h2>Downloading Question Papers</h2>
          <p>If your admin has uploaded question papers for an exam, you will see a <strong>Question Papers</strong> section on the exam card.</p>
          <ol>
            <li>Find your exam card on the Today's Exams page</li>
            <li>Look for the <strong>Question Papers</strong> box (below the time slots)</li>
            <li>Each question paper shows the file name and size</li>
            <li>Click the <strong>Download</strong> button next to the paper you want</li>
            <li>The file will download to your device</li>
          </ol>
          <div class="tip-box">Download your question papers as soon as the exam starts. If the admin uploaded multiple papers, download all of them.</div>
        </div>

        <div class="manual-section" id="submit-answer">
          <h2>Submitting Your Answer</h2>
          <ol>
            <li>On the exam card, click the <strong>Upload Answer</strong> button</li>
            <li>A dialog will appear with a file drop zone</li>
            <li><strong>Drag and drop</strong> your answer file into the zone, or click to <strong>browse</strong> files</li>
            <li>Supported formats: <strong>PDF, DOC, DOCX, JPG, JPEG, PNG, ZIP</strong></li>
            <li>Maximum file size: <strong>100 MB</strong></li>
            <li>Your selected file name and size will be shown</li>
            <li>Click <strong>Submit Answer</strong></li>
            <li>Wait for the upload to complete — you will see a progress bar</li>
            <li>A success message will appear when done</li>
          </ol>
          <div class="warn-box">You must submit before the exam time slot ends. Once all slots have expired, submissions are blocked.</div>
        </div>

        <div class="manual-section" id="reupload">
          <h2>Re-uploading an Answer</h2>
          <p>If the exam is still open (active and within time), you can replace your previous submission:</p>
          <ol>
            <li>On the exam card, your submitted file will be shown in green</li>
            <li>Click the <strong>Re-upload</strong> button</li>
            <li>Select your new file and submit</li>
            <li>Your previous file will be replaced</li>
          </ol>
          <div class="tip-box">Re-upload is only available while the exam is still active and at least one time slot has not ended.</div>
        </div>

        <div class="manual-section" id="history">
          <h2>Submission History</h2>
          <p>Below the exam cards, you will find a <strong>Submission History</strong> table showing:</p>
          <ul>
            <li><strong>Exam name</strong> and <strong>subject</strong></li>
            <li><strong>File name</strong> you submitted</li>
            <li><strong>Submission date and time</strong></li>
            <li>A <strong>View</strong> button to download your submitted file</li>
          </ul>
          <p>This history shows all your submissions across all exams, not just today's.</p>
        </div>

        <div class="manual-section" id="tips">
          <h2>Tips & Best Practices</h2>
          <ul>
            <li><strong>Login early</strong> — check that you can see your exam before it starts</li>
            <li><strong>Download question papers first</strong> — get them as soon as the exam begins</li>
            <li><strong>Check the countdown</strong> — know how much time you have left</li>
            <li><strong>Name your file clearly</strong> — include your name or roll number in the file name</li>
            <li><strong>Use PDF format</strong> — it's the most reliable for scanned answer sheets</li>
            <li><strong>Check file size</strong> — make sure your file is under 100 MB before uploading</li>
            <li><strong>Verify submission</strong> — after uploading, check that your file appears as "Submitted" (green)</li>
            <li><strong>Re-upload if needed</strong> — you can replace your answer as long as the exam is open</li>
            <li>If you don't see any exams, contact your admin — you may not be assigned yet</li>
          </ul>
        </div>
      `;
    }
  </script>
</body>
</html>
