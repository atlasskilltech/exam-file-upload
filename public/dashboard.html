<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalVault — Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .welcome-section {
      text-align: center;
      padding: 40px 20px 32px;
    }
    .welcome-avatar {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--accent);
      color: #000;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .welcome-section h1 {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 28px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .welcome-section p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .nav-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .nav-card:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateY(-2px);
    }
    .nav-card .card-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .nav-card:hover .card-icon { color: var(--accent); }
    .nav-card .card-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .nav-card .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="welcome-section">
        <div class="welcome-avatar" id="avatar"></div>
        <h1 id="welcomeTitle">Welcome to LocalVault</h1>
        <p id="welcomeDesc">Select a section to get started</p>
      </div>
      <div class="nav-grid" id="navGrid"></div>
    </main>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    (async () => {
      const user = await checkAuth();
      if (!user) return;

      document.getElementById('app').insertAdjacentHTML('afterbegin', getSidebarHTML());
      initSidebar(user);

      // Avatar initial
      const initial = (user.username || 'U').charAt(0).toUpperCase();
      document.getElementById('avatar').textContent = initial;

      // Welcome text
      document.getElementById('welcomeTitle').textContent = `Welcome, ${user.username}`;
      document.getElementById('welcomeDesc').textContent =
        user.role === 'admin'
          ? 'Manage exams, students, and submissions'
          : 'View your exams and submit answers';

      // Build nav cards based on role
      const cards = [];

      if (user.role === 'admin') {
        cards.push(
          {
            href: '/exams.html',
            icon: `<svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 0a.5.5 0 0 1 .5.5V2h4V.5a.5.5 0 0 1 1 0V2h1a2 2 0 0 1 2 2v1H2V4a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM2 7v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H2zm6.5 1a.5.5 0 0 1 .5.5v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L8 12.293V8.5a.5.5 0 0 1 .5-.5z"/></svg>`,
            title: 'Exam Manager',
            desc: 'Create, edit & manage exams'
          },
          {
            href: '/admin.html',
            icon: `<svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/></svg>`,
            title: 'Students',
            desc: 'Add, manage & bulk upload students'
          },
          {
            href: '/reports.html',
            icon: `<svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M4 11H2v3h2v-3zm5-4H7v7h2V7zm5-5h-2v12h2V2zm-2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1h-2zM6 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7zm-5 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-3z"/></svg>`,
            title: 'Reports',
            desc: 'Analytics & activity logs'
          },
          {
            href: '/manual.html',
            icon: `<svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/></svg>`,
            title: 'User Manual',
            desc: 'How to use the system'
          }
        );
      }

      if (user.role === 'student') {
        cards.push(
          {
            href: '/student-exams.html',
            icon: `<svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 0a.5.5 0 0 1 .5.5V2h4V.5a.5.5 0 0 1 1 0V2h1a2 2 0 0 1 2 2v1H2V4a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM2 7v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H2zm6.5 1a.5.5 0 0 1 .5.5v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L8 12.293V8.5a.5.5 0 0 1 .5-.5z"/></svg>`,
            title: 'My Exams',
            desc: 'View exams & submit answers'
          },
          {
            href: '/manual.html',
            icon: `<svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/></svg>`,
            title: 'User Manual',
            desc: 'How to use the system'
          }
        );
      }

      // Render cards
      document.getElementById('navGrid').innerHTML = cards.map(c => `
        <a href="${c.href}" class="nav-card">
          <div class="card-icon">${c.icon}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-desc">${c.desc}</div>
        </a>
      `).join('');
    })();
  </script>
</body>
</html>
