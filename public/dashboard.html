<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalVault — Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .main-content.dashboard-main {
      background: #f4f6f9;
      min-height: 100vh;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .dashboard-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 60px;
    }

    /* ── Welcome section ─────────────────── */
    .welcome-section {
      text-align: center;
      margin-bottom: 40px;
    }
    .welcome-avatar {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: #2ecc71;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(46, 204, 113, 0.3);
    }
    .welcome-section h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: #1a1a2e;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .welcome-section p {
      color: #8a8fa8;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }

    /* ── Navigation card grid ────────────── */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 768px) {
      .nav-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .nav-grid { grid-template-columns: 1fr; }
    }

    .nav-card {
      background: #fff;
      border: 1px solid #e2e6ed;
      border-radius: 14px;
      padding: 32px 20px 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: block;
    }
    .nav-card:hover {
      border-color: #c5cad6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transform: translateY(-2px);
    }

    .nav-card .card-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5a6178;
    }
    .nav-card:hover .card-icon {
      color: #3a4a6b;
    }

    .nav-card .card-title {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .nav-card .card-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #8a8fa8;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content dashboard-main">
      <div class="dashboard-wrapper">
        <div class="welcome-section">
          <div class="welcome-avatar" id="avatar"></div>
          <h1 id="welcomeTitle">Welcome to LocalVault</h1>
          <p id="welcomeDesc">Select a section from the sidebar to get started</p>
        </div>
        <div class="nav-grid" id="navGrid"></div>
      </div>
    </main>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    (async () => {
      const user = await checkAuth();
      if (!user) return;

      document.getElementById('app').insertAdjacentHTML('afterbegin', getSidebarHTML());
      initSidebar(user);

      // Avatar initial
      const initial = (user.username || 'U').charAt(0).toUpperCase();
      document.getElementById('avatar').textContent = initial;

      // Welcome text
      document.getElementById('welcomeTitle').textContent = `Welcome to LocalVault`;
      document.getElementById('welcomeDesc').textContent = 'Select a section from the sidebar to get started';

      // Build nav cards based on role
      const cards = [];

      if (user.role === 'admin') {
        cards.push(
          {
            href: '/exams.html',
            icon: `<svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M12 14l-2 2 2 2"/><path d="M12 14l2 2-2 2"/></svg>`,
            title: 'Exam Manager',
            desc: 'Create, edit & manage exams'
          },
          {
            href: '/admin.html',
            icon: `<svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
            title: 'Students',
            desc: 'Overview & stats'
          },
          {
            href: '/reports.html',
            icon: `<svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>`,
            title: 'Reports',
            desc: 'Dashboard, analytics & logs'
          },
          {
            href: '/manual.html',
            icon: `<svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            title: 'User Manual',
            desc: 'How to use the system'
          }
        );
      }

      if (user.role === 'student') {
        cards.push(
          {
            href: '/student-exams.html',
            icon: `<svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M12 14l-2 2 2 2"/><path d="M12 14l2 2-2 2"/></svg>`,
            title: 'My Exams',
            desc: 'View exams & submit answers'
          },
          {
            href: '/manual.html',
            icon: `<svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            title: 'User Manual',
            desc: 'How to use the system'
          }
        );
      }

      // Render cards
      document.getElementById('navGrid').innerHTML = cards.map(c => `
        <a href="${c.href}" class="nav-card">
          <div class="card-icon">${c.icon}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-desc">${c.desc}</div>
        </a>
      `).join('');
    })();
  </script>
</body>
</html>
