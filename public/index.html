<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalVault — Login</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h1>LocalVault</h1>
      <p class="subtitle">Offline File Management System</p>
      <div class="error-msg" id="errorMsg"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" id="loginBtn">
          Login
        </button>
      </form>
    </div>
  </div>

  <script>
    // If already logged in, redirect to dashboard
    fetch('/auth/check').then(r => { if (r.ok) window.location.href = '/dashboard.html'; });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errorMsg.textContent = data.message;
          errorMsg.style.display = 'block';
        }
      } catch {
        errorMsg.textContent = 'Connection error. Is the server running?';
        errorMsg.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Login';
    });
  </script>
</body>
</html>
