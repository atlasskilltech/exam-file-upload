<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalVault — Exam Manager</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .exam-stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .exam-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 24px; text-align: center; flex: 1; min-width: 120px; }
    .exam-stat .val { font-family: var(--font-heading); font-weight: 800; font-size: 28px; color: var(--accent); }
    .exam-stat .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .status-active { color: var(--green); }
    .status-closed { color: var(--text-muted); }
    .slot-list { margin-top: 8px; }
    .slot-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .slot-row .form-control { width: auto; flex: 1; min-width: 100px; }
    .slot-tag { display: inline-block; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; font-size: 11px; color: var(--cyan); margin: 2px 4px 2px 0; }
    .slot-tag .room { color: var(--accent); }
    .remove-slot { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; padding: 0 4px; }
  </style>
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <h1>Exam Manager</h1>
          <p>Create and manage exams with multiple time slots.</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Create Exam</button>
      </div>

      <div class="exam-stats" id="examStats"></div>

      <div class="card" style="position:relative">
        <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Subject</th>
                <th>Slots</th>
                <th>Status</th>
                <th>Submissions</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="examsTable">
              <tr><td colspan="7" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Exam Modal -->
  <div class="modal-overlay" id="examModal">
    <div class="modal" style="max-width:560px">
      <h3 id="examModalTitle">Create Exam</h3>
      <form id="examForm">
        <input type="hidden" id="examEditId">
        <div class="form-group">
          <label>Exam Title</label>
          <input type="text" class="form-control" id="examTitle" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" class="form-control" id="examSubject" required>
        </div>

        <div class="form-group">
          <label>Time Slots</label>
          <div class="slot-list" id="slotList"></div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="addSlotRow()" style="margin-top:4px">+ Add Slot</button>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeExamModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="examSubmitBtn">Create Exam</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manage Slots Modal (for existing exams) -->
  <div class="modal-overlay" id="slotsModal">
    <div class="modal" style="max-width:560px">
      <h3>Manage Slots — <span id="slotsExamTitle"></span></h3>
      <div id="existingSlots" style="margin-bottom:16px"></div>
      <hr style="border-color:var(--border);margin:16px 0">
      <h4 style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Add New Slot</h4>
      <div class="slot-row" id="newSlotRow">
        <input type="date" class="form-control" id="newSlotDate">
        <input type="time" class="form-control" id="newSlotStart">
        <input type="time" class="form-control" id="newSlotEnd">
        <input type="text" class="form-control" id="newSlotRoom" placeholder="Room">
        <button type="button" class="btn btn-primary btn-sm" onclick="addNewSlot()">Add</button>
      </div>
      <input type="hidden" id="slotsExamId">
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-secondary" onclick="closeSlotsModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    // Parse date/time from MySQL (may come as ISO or raw)
    function fmtDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
    }
    function fmtTime(t) {
      if (!t) return '';
      return String(t).slice(0, 5);
    }

    (async () => {
      const user = await checkAuth();
      if (!user) return;
      if (user.role !== 'admin') { window.location.href = '/dashboard.html'; return; }

      document.getElementById('app').insertAdjacentHTML('afterbegin', getSidebarHTML());
      initSidebar(user);
      loadExams();
    })();

    async function loadExams() {
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('active');

      try {
        const res = await apiFetch('/exams');
        const exams = res.data;
        const tbody = document.getElementById('examsTable');

        const total = exams.length;
        const active = exams.filter(e => e.status === 'active').length;
        const closed = total - active;
        const totalSubs = exams.reduce((a, e) => a + (e.submission_count || 0), 0);

        document.getElementById('examStats').innerHTML = `
          <div class="exam-stat"><div class="val">${total}</div><div class="lbl">Total Exams</div></div>
          <div class="exam-stat"><div class="val" style="color:var(--green)">${active}</div><div class="lbl">Active</div></div>
          <div class="exam-stat"><div class="val" style="color:var(--text-muted)">${closed}</div><div class="lbl">Closed</div></div>
          <div class="exam-stat"><div class="val" style="color:var(--cyan)">${totalSubs}</div><div class="lbl">Submissions</div></div>
        `;

        if (exams.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No exams yet. Create one to get started.</td></tr>';
        } else {
          tbody.innerHTML = exams.map((e, i) => {
            const slotTags = (e.slots || []).map(s =>
              `<span class="slot-tag"><span class="room">${esc(s.room)}</span> ${fmtDate(s.slot_date)} ${fmtTime(s.start_time)}–${fmtTime(s.end_time)}</span>`
            ).join('');

            return `<tr>
              <td>${i + 1}</td>
              <td><strong>${esc(e.title)}</strong></td>
              <td>${esc(e.subject)}</td>
              <td>${slotTags || '<span style="color:var(--text-muted)">No slots</span>'}</td>
              <td><span class="status-${e.status}">${e.status}</span></td>
              <td>${e.submission_count || 0}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-secondary btn-sm" onclick="openSlotsModal(${e.id}, '${escAttr(e.title)}')">Slots</button>
                <a href="/exam-submissions.html?id=${e.id}" class="btn btn-secondary btn-sm">View</a>
                <button class="btn btn-secondary btn-sm" onclick="openEditModal(${e.id}, '${escAttr(e.title)}', '${escAttr(e.subject)}', ${JSON.stringify(e.slots || []).replace(/"/g, '&quot;')})">Edit</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleStatus(${e.id}, '${e.status === 'active' ? 'closed' : 'active'}')">${e.status === 'active' ? 'Close' : 'Open'}</button>
                <button class="btn btn-danger btn-sm" onclick="deleteExam(${e.id}, '${escAttr(e.title)}')">Del</button>
              </td>
            </tr>`;
          }).join('');
        }
      } catch (err) {
        showToast('Failed to load exams', 'error');
      }

      overlay.classList.remove('active');
    }

    // ── Slot rows in create/edit form ─────────────────────
    let slotCounter = 0;

    function addSlotRow(data) {
      const id = slotCounter++;
      const list = document.getElementById('slotList');
      const row = document.createElement('div');
      row.className = 'slot-row';
      row.id = `slot-row-${id}`;
      row.innerHTML = `
        <input type="date" class="form-control slot-date" value="${data ? fmtDate(data.slot_date) : ''}" required>
        <input type="time" class="form-control slot-start" value="${data ? fmtTime(data.start_time) : ''}" required>
        <input type="time" class="form-control slot-end" value="${data ? fmtTime(data.end_time) : ''}" required>
        <input type="text" class="form-control slot-room" value="${data?.room || ''}" placeholder="Room" required>
        <button type="button" class="remove-slot" onclick="this.parentElement.remove()">x</button>
      `;
      list.appendChild(row);
    }

    function getFormSlots() {
      const rows = document.querySelectorAll('#slotList .slot-row');
      const slots = [];
      rows.forEach(row => {
        const d = row.querySelector('.slot-date').value;
        const s = row.querySelector('.slot-start').value;
        const e = row.querySelector('.slot-end').value;
        const r = row.querySelector('.slot-room').value;
        if (d && s && e && r) slots.push({ slot_date: d, start_time: s, end_time: e, room: r });
      });
      return slots;
    }

    // ── Create/Edit modal ─────────────────────────────────
    function openCreateModal() {
      document.getElementById('examModalTitle').textContent = 'Create Exam';
      document.getElementById('examSubmitBtn').textContent = 'Create Exam';
      document.getElementById('examEditId').value = '';
      document.getElementById('examForm').reset();
      document.getElementById('slotList').innerHTML = '';
      slotCounter = 0;
      addSlotRow(); // start with one empty row
      document.getElementById('examModal').classList.add('active');
    }

    function openEditModal(id, title, subject, slots) {
      document.getElementById('examModalTitle').textContent = 'Edit Exam';
      document.getElementById('examSubmitBtn').textContent = 'Save Changes';
      document.getElementById('examEditId').value = id;
      document.getElementById('examTitle').value = title;
      document.getElementById('examSubject').value = subject;
      document.getElementById('slotList').innerHTML = '';
      slotCounter = 0;
      if (slots && slots.length > 0) {
        slots.forEach(s => addSlotRow(s));
      } else {
        addSlotRow();
      }
      document.getElementById('examModal').classList.add('active');
    }

    function closeExamModal() {
      document.getElementById('examModal').classList.remove('active');
    }

    document.getElementById('examForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('examEditId').value;
      const slots = getFormSlots();

      if (slots.length === 0) {
        showToast('Add at least one time slot', 'error');
        return;
      }

      const body = {
        title: document.getElementById('examTitle').value,
        subject: document.getElementById('examSubject').value,
        slots
      };

      try {
        if (editId) {
          await apiFetch(`/exams/update/${editId}`, { method: 'PUT', body: JSON.stringify(body) });
          showToast('Exam updated');
        } else {
          await apiFetch('/exams/create', { method: 'POST', body: JSON.stringify(body) });
          showToast('Exam created');
        }
        closeExamModal();
        loadExams();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    // ── Manage Slots Modal (add/remove on existing exam) ──
    async function openSlotsModal(examId, title) {
      document.getElementById('slotsExamTitle').textContent = title;
      document.getElementById('slotsExamId').value = examId;
      document.getElementById('slotsModal').classList.add('active');
      document.getElementById('newSlotDate').value = '';
      document.getElementById('newSlotStart').value = '';
      document.getElementById('newSlotEnd').value = '';
      document.getElementById('newSlotRoom').value = '';
      await refreshSlotsList(examId);
    }

    function closeSlotsModal() {
      document.getElementById('slotsModal').classList.remove('active');
      loadExams();
    }

    async function refreshSlotsList(examId) {
      try {
        const res = await apiFetch(`/exams/${examId}/slots`);
        const container = document.getElementById('existingSlots');
        if (res.data.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);font-size:13px">No slots yet.</p>';
        } else {
          container.innerHTML = res.data.map(s => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">
              <span><strong style="color:var(--accent)">${esc(s.room)}</strong> — ${fmtDate(s.slot_date)} ${fmtTime(s.start_time)} to ${fmtTime(s.end_time)}</span>
              <button class="btn btn-danger btn-sm" onclick="removeSlot(${s.id})">Remove</button>
            </div>
          `).join('');
        }
      } catch {
        document.getElementById('existingSlots').innerHTML = '<p style="color:var(--red)">Failed to load slots</p>';
      }
    }

    async function addNewSlot() {
      const examId = document.getElementById('slotsExamId').value;
      const slot_date = document.getElementById('newSlotDate').value;
      const start_time = document.getElementById('newSlotStart').value;
      const end_time = document.getElementById('newSlotEnd').value;
      const room = document.getElementById('newSlotRoom').value;

      if (!slot_date || !start_time || !end_time || !room) {
        showToast('Fill all slot fields', 'error');
        return;
      }

      try {
        await apiFetch(`/exams/${examId}/slots`, {
          method: 'POST',
          body: JSON.stringify({ slot_date, start_time, end_time, room })
        });
        showToast('Slot added');
        document.getElementById('newSlotDate').value = '';
        document.getElementById('newSlotStart').value = '';
        document.getElementById('newSlotEnd').value = '';
        document.getElementById('newSlotRoom').value = '';
        await refreshSlotsList(examId);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function removeSlot(slotId) {
      const examId = document.getElementById('slotsExamId').value;
      try {
        await apiFetch(`/exams/slots/${slotId}`, { method: 'DELETE' });
        showToast('Slot removed');
        await refreshSlotsList(examId);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function toggleStatus(id, newStatus) {
      try {
        await apiFetch(`/exams/${id}/status`, { method: 'POST', body: JSON.stringify({ status: newStatus }) });
        showToast(`Exam ${newStatus}`);
        loadExams();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteExam(id, title) {
      const ok = await showConfirm(`Delete exam "${title}" and all its submissions?`);
      if (!ok) return;
      try {
        await apiFetch(`/exams/delete/${id}`, { method: 'DELETE' });
        showToast('Exam deleted');
        loadExams();
      } catch (err) { showToast(err.message, 'error'); }
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }
    function escAttr(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
