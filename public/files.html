<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS Exam — My Files</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="app-layout" id="app">
    <main class="main-content">
      <div class="page-header">
        <h1>My Files</h1>
        <p>Search, filter, and manage your uploaded files.</p>
      </div>

      <div class="toolbar">
        <input type="text" class="form-control" id="searchInput" placeholder="Search by filename...">
        <select class="form-control" id="categoryFilter" style="max-width:200px">
          <option value="">All Categories</option>
        </select>
        <select class="form-control" id="typeFilter" style="max-width:160px">
          <option value="">All Types</option>
          <option value="image">Images</option>
          <option value="video">Videos</option>
          <option value="pdf">PDFs</option>
          <option value="doc">Documents</option>
          <option value="other">Other</option>
        </select>
        <select class="form-control" id="sortFilter" style="max-width:160px">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="largest">Largest First</option>
          <option value="smallest">Smallest First</option>
        </select>
      </div>

      <div class="card" style="position:relative">
        <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Filename</th>
                <th>Type</th>
                <th>Size</th>
                <th>Category</th>
                <th>Uploaded</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="filesTable">
              <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    let currentPage = 1;
    let debounceTimer;

    (async () => {
      const user = await checkAuth();
      if (!user) return;

      document.getElementById('app').insertAdjacentHTML('afterbegin', getSidebarHTML());
      initSidebar(user);

      // Load categories for filter
      try {
        const catRes = await apiFetch('/categories');
        const select = document.getElementById('categoryFilter');
        catRes.data.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.textContent = cat.name;
          select.appendChild(opt);
        });
      } catch {}

      // Initial load
      loadFiles();

      // Live search with debounce
      document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { currentPage = 1; loadFiles(); }, 300);
      });

      // Filter changes
      ['categoryFilter', 'typeFilter', 'sortFilter'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => { currentPage = 1; loadFiles(); });
      });
    })();

    async function loadFiles() {
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('active');

      const search = document.getElementById('searchInput').value;
      const category = document.getElementById('categoryFilter').value;
      const type = document.getElementById('typeFilter').value;
      const sort = document.getElementById('sortFilter').value;

      const params = new URLSearchParams({ page: currentPage, sort });
      if (search) params.set('search', search);
      if (category) params.set('category', category);
      if (type) params.set('type', type);

      try {
        const res = await apiFetch(`/files?${params}`);
        const { files, pagination } = res.data;
        const tbody = document.getElementById('filesTable');

        if (files.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="empty-icon">0</div><p>No files found</p></td></tr>';
        } else {
          tbody.innerHTML = files.map(f => `
            <tr>
              <td>${escapeHtml(f.original_name)}</td>
              <td>${getTypeLabel(f.mime_type)}</td>
              <td>${formatSize(f.size_bytes)}</td>
              <td>${f.category_name || '—'}</td>
              <td>${formatDate(f.uploaded_at)}</td>
              <td>
                <a href="/files/download/${f.id}" class="btn btn-secondary btn-sm">Download</a>
                <button class="btn btn-danger btn-sm" onclick="deleteFile(${f.id}, '${escapeAttr(f.original_name)}')">Delete</button>
              </td>
            </tr>
          `).join('');
        }

        // Pagination
        renderPagination(pagination);
      } catch (err) {
        showToast('Failed to load files', 'error');
      }

      overlay.classList.remove('active');
    }

    function renderPagination(p) {
      const el = document.getElementById('pagination');
      if (p.totalPages <= 1) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <button ${p.page <= 1 ? 'disabled' : ''} onclick="goPage(${p.page - 1})">Prev</button>
        <span class="page-info">Page ${p.page} of ${p.totalPages}</span>
        <button ${p.page >= p.totalPages ? 'disabled' : ''} onclick="goPage(${p.page + 1})">Next</button>
      `;
    }

    function goPage(page) {
      currentPage = page;
      loadFiles();
    }

    async function deleteFile(id, name) {
      const confirmed = await showConfirm(`Delete "${name}"? This cannot be undone.`);
      if (!confirmed) return;

      try {
        await apiFetch(`/files/delete/${id}`, { method: 'DELETE' });
        showToast('File deleted');
        loadFiles();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function getTypeLabel(mime) {
      if (!mime) return 'Unknown';
      if (mime.startsWith('image/')) return 'Image';
      if (mime.startsWith('video/')) return 'Video';
      if (mime === 'application/pdf') return 'PDF';
      if (mime.startsWith('text/') || mime.includes('word') || mime.includes('document')) return 'Document';
      return 'Other';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
